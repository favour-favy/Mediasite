{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Media</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'gallery/style.css' %}">
    <style>
        body { background-color: #12121c; color: #f1f1f1; }
        .card { background-color: #1c1c2b; border: none; }
    </style>
</head>
<body>

<div class="container mt-5" style="max-width: 500px;">
    <div class="card p-4 shadow-sm text-center">
        <h3 class="mb-3">Delete "{{ item.title }}"?</h3>
        <p class="text-secondary">This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100">Yes, delete</button>
        </form>

        <a href="{% url 'gallery' %}" class="mt-3">← Cancel, back to gallery</a>
    </div>
</div>

</body>
</html>
