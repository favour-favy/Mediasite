{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ action }} Media</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'gallery/style.css' %}">
    <style>
        body { background-color: #12121c; color: #f1f1f1; }
        .card { background-color: #1c1c2b; border: none; }
        .form-control, .form-select { background-color: #23233a; color: #fff; border: 1px solid #3a3a55; }
        .form-control:focus, .form-select:focus { background-color: #23233a; color: #fff; }
        label { color: #cfcfe8; }
    </style>
</head>
<body>

<div class="container mt-5" style="max-width: 600px;">
    <div class="card p-4 shadow-sm">
        <h2 class="mb-4">{{ action }} Media Item</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary mt-3">{{ action }}</button>
        </form>

        <a href="{% url 'gallery' %}" class="mt-3">← Back to gallery</a>
    </div>
</div>

</body>
</html>
